<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Salário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="caixa">
    <h1>Calculadora de Salário</h1>

    <label>Salário Bruto</label>
    <input type="number" id="salario" placeholder="Digite o salário">

    <label>Dependentes</label>
    <select id="dependentes">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
    </select>

    <label>Paga pensão?</label>
    <select id="pensao" onchange="mostrarPensao()">
        <option value="nao">Não</option>
        <option value="sim">Sim</option>
    </select>

    <div id="campoPensao">
        <label>Valor da Pensão</label>
        <input type="number" id="valorPensao" placeholder="Digite o valor">
    </div>

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>

</div>

<script src="script.js"></script>

</body>
</html>
